events {
    worker_connections 1024;
}

http {

    server {
        listen 80;
        listen [::]:80;
        
        server_name backend_app.antons.rekrutacja.solvro.cloud antons.rekrutacja.solvro.cloud;

        location / {
            proxy_pass http://backend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
    listen 80;
        listen [::]:80;
        
        server_name  web_solvro_docs.antons.rekrutacja.solvro.cloud antons.rekrutacja.solvro.cloud;

        location / {
            proxy_pass http://backend:4321;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }    
    }


}