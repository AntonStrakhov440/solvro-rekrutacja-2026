services:
    db:
        image: postgres:16-alpine
        container_name: solvro_db
        restart: unless-stopped
        ports:
            - "5432:5432"
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        volumes:
            - postgres_data:/var/lib/postgresql/data

    backend:
        build:
            context: ../backend
            dockerfile: Dockerfile
        container_name: solvro_backend
        restart: unless-stopped
        depends_on:
            - db
        env_file:
            - ../backend/.env
        ports:
            - "5000:5000"
        expose:
            - "5000"
        environment:
            - DB_HOST=db
            - DB_PORT=5432
            - DB_USERNAME=${POSTGRES_USER}
            - DB_PASSWORD=${POSTGRES_PASSWORD}
            - DB_NAME=${POSTGRES_DB}

    web-solvro-docs:
        build:
            context: ../web-solvro-docs
            dockerfile: Dockerfile

    nginx:
        image: nginx:alpine
        container_name: solvro_nginx
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf:ro
        depends_on:
            - backend
            - web-solvro-docs

volumes:
    postgres_data:
